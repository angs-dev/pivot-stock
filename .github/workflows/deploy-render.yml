name: Deploy Web App

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-web-app
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and trigger Render
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        run: npm run build

      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Render deploy hook not configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "Set the RENDER_DEPLOY_HOOK_URL repository secret to deploy automatically."
